name: chatpress
description: >
  Official Flutter SDK for integrating the Chatpress AI chatbot into mobile apps.
  Ships a drop-in ChatpressWidget and a headless ChatpressClient for full control.
version: 1.0.2
homepage: https://chatpress.heapvue.com
repository: https://github.com/Heapvue/chatpress-sdk
issue_tracker: https://github.com/Heapvue/chatpress-sdk/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
